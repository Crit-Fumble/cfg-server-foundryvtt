name: test

# CI for the CFG Server Manager Foundry module (module/) AND, since 2026-08-15,
# the container wrapper's felddy contract (check-felddy-contract.mjs).
#
# ⚠️ The wrapper is verified at TWO altitudes and only one of them is here. This
# workflow proves the image is an additive superset of the pinned base and still
# carries what cfg-core-server depends on — no license, no secrets. It does NOT
# prove Foundry works: the license host-binding, admin.txt authenticating, the
# /join /setup surface and the world's LevelDB unlock need a licensed Foundry and
# live in e2e/, which runs locally and is deliberately not in CI. A green here is
# not a working game server.

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: module/package-lock.json
      # Tokenless on purpose: the module has ZERO @crit-fumble/* dependencies
      # (vendored 2026-08-19, dt#623) — this job runs on any fork, no org
      # token, no GitHub Packages. If npm ci ever needs auth again, a public
      # repo has regressed to depending on a private package.
      - run: npm ci
      - run: npm test
      # Pack smoke — build-zip walks the real tree, so a deleted/renamed runtime
      # file that tests don't import still fails here instead of at release time.
      - run: npm run build:zip

  # The service-GM driver image ships its own Playwright, and agent/Dockerfile
  # requires it to move in lockstep with the root lock. `npm ci` inside the image
  # build only compares agent/package.json to agent/package-lock.json, so the
  # third edge of that triangle was enforced by a comment alone — the same shape
  # as the base digest that "read as pinned" while Playwright floated below it.
  #
  # No npm install, no registry, no Docker: the check reads three committed JSON
  # files. Deliberately NOT folded into `unit`, whose working-directory is
  # `module/` and whose npm auth this does not need.
  agent-pin:
    name: Agent Playwright pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm run test:agent

  # The module's release channel is `releases/latest/download/`, named by
  # module.json's own manifest/download URLs — so a `v*` tag IS the publish, with
  # no separate step and no staging tier. Nothing checked that the VERSION moved
  # when the packed tree did.
  #
  # Hosted worlds survive that by accident (syncCfgPlugin reinstalls with
  # force: true every launch, never reading the version). Self-hosted worlds do
  # not: Foundry compares the manifest version to decide an update exists, so an
  # unbumped release leaves them on old code reporting itself up to date.
  #
  # Runs pre-merge on purpose. At release time the tag is already pushed, and the
  # fix would be deleting and re-cutting it.
  #
  # `fetch-depth: 0` is load-bearing — the check diffs against the newest `v*`
  # tag reachable from HEAD, and the default shallow clone has neither the tags
  # nor the history to do it.
  module-version:
    name: Module version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm run test:module-version

  # The Dockerfile is a pure passthrough — FROM + four LABELs — and its load-bearing
  # rule ("DO NOT add an ENTRYPOINT") was enforced by a COMMENT. Same shape as the two
  # guards above, one layer down: this one builds the image.
  #
  # It proves three things nothing else does: the Dockerfile SOURCE added no forbidden
  # instruction, the built image is still an additive superset of the pinned base
  # (base layers an unmodified prefix, every Config field equal by union sweep,
  # felddy's 13 /home/node scripts byte-identical), and the values cfg-core-server
  # depends on are intact (uid 1000:1000, WORKDIR, non-empty CMD, HEALTHCHECK, PID 1,
  # prompt SIGTERM). It is the guard on the daily upstream-watch bump PR, which
  # rewrites the FROM digest by sed — until now nothing looked at what came back.
  #
  # NO LICENSE, NO SECRET, NO npm ci, NO GHCR LOGIN — the scripts use only node
  # built-ins, and the one network dependency is an anonymous Docker Hub pull of the
  # pinned base (~115 MB), retried 3x inside the check.
  #
  # Deliberately NO `if:` — a job-level condition that evaluates false reports
  # `skipped`, which ci-gate's fail-closed allowlist PASSES. If this cannot run, it
  # must FAIL, never skip.
  #
  # ⚠️ ACCEPTED RISK, STATED PLAINLY: this joins ci-gate, the repo's ONLY required
  # context, so a Docker Hub outage or rate limit blocks every merge including
  # docs-only PRs. That is the correct trade under this repo's doctrine — a flaky red
  # beats a lying green — and the retry covers the transient case. The mitigation NOT
  # taken is a Docker Hub token: that is an owner action and would add a 401 failure
  # mode to a check that currently needs no credential.
  image-contract:
    name: felddy image contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Offline half first: mutation suite over fixtures, no Docker, ~0.1s. If the
      # decision functions are wrong, nothing below is worth running.
      - run: npm run test:image-contract
      # Live half: parses the FROM digest, pulls, builds, inspects, runs probe
      # containers. Docker is preinstalled on ubuntu-latest.
      - run: npm run check:image-contract

  # ── THE ONLY REQUIRED CONTEXT ─────────────────────────────────────────────
  # Branch protection requires `ci-gate` and nothing else, so renaming or
  # splitting a job needs no branch-protection change.
  # `if: always()` — without it the gate is SKIPPED on a failed dependency,
  # which reports as neither pass nor fail and hangs the PR.
  # ⚠️ FAIL-CLOSED, AND IT MUST STAY THAT WAY. `success` and `skipped` pass;
  # EVERY other result fails, including ones GitHub has not documented.
  # This was a denylist (`failure` or `cancelled`) in cfg-foundry-plugin until
  # 2026-08-06, when an Actions partial outage produced `"result": "abandoned"`
  # — which matched neither, so the gate reported SUCCESS over a job that never
  # ran. CI Gate is the ONLY required check, so that made branch protection
  # satisfiable with zero tests. Never enumerate the bad values; enumerate the
  # good ones.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [unit, agent-pin, module-version, image-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          echo "$RESULTS"
          BAD=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$BAD" ]; then
            echo "::error::CI Gate FAILED — these jobs did not pass:"
            # shellcheck disable=SC2086  # deliberate word-split — one job per line
            printf '  %s\n' $BAD
            exit 1
          fi
          echo "✓ CI Gate: nothing failed"
