name: release

# Build the wrapper image and push to GitHub Container Registry.
#
# Triggered on `v*` tag pushes (e.g. `git tag v0.1.0 && git push --tags`) and
# manually via the Actions UI. Pushed to ghcr.io/crit-fumble/cfg-server-foundryvtt
# with: the git ref (e.g. v0.1.0), `latest` (`v*` tags ONLY), sha-<short>, and
# `14` — the Foundry MAJOR tag (felddy-style moving tag for the 14.x line). The CFG
# platform launches campaign containers as `<imageName>:<foundryMajor>` (see
# foundry-platform getFoundryImageTag), so `cfg-server-foundryvtt:14` is the tag the
# core-server actually pulls. Bump it alongside the felddy base `FROM` digest when
# moving to Foundry 15.
#
# Also builds the service-GM drain DRIVER image (agent/) -> ghcr.io/crit-fumble/
# cfg-foundry-service-gm, the one-shot headless Chromium container core-server's
# launcher spawns (default tag :latest). Both are pure-Docker builds (no BuildKit
# npmrc secret needed yet).
#
# Mirrors cfg-server-disrecord / cfg-core-server release.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Used only for naming when run manually.'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crit-fumble/cfg-server-foundryvtt
          tags: |
            type=ref,event=tag
            type=raw,value=14
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agent:
    # The service-GM drain driver (one-shot headless Chromium). core-server's
    # launcher pulls ghcr.io/crit-fumble/cfg-foundry-service-gm:latest by default.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crit-fumble/cfg-foundry-service-gm
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  module-assets:
    # CFG Server Manager Foundry module (module/) — build the module zip and
    # attach it + its manifest to the GitHub release for this tag. These assets
    # ARE the module's delivery channel: module.json's own manifest/download
    # URLs point at releases/latest/download/, which resolves to whatever the
    # newest release carries, so uploading here is publishing. Installing an
    # older release's manifest therefore still downloads the newest zip —
    # accepted: hosted launches always install latest, and per-install pinning
    # is the Foundry APP version's job, never the module's.
    #
    # ⚠️ Hosted launches keep installing from cfg-foundry-plugin `main` until
    # `foundryPluginManifestUrl` is flipped in cfg-core-server config (all
    # config locations + the server.ts code fallback) — an owner/config change,
    # deliberately not part of this repo.
    #
    # Tag pushes only (a manual dispatch has no release to attach to). The
    # release object may not exist yet when the tag is pushed from the CLI, so
    # create it if missing rather than failing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Build module zip + manifest
        # build-zip.js uses Node built-ins only — no npm ci needed.
        run: node module/scripts/build-zip.js

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            module/dist/module.json \
            module/dist/module.zip \
            module/dist/crit-fumble-core-*.zip
